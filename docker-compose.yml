version: '3.8'

services:
  bot-backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - METAAPI_TOKEN=${METAAPI_TOKEN}
      - METAAPI_ACCOUNT_ID=${METAAPI_ACCOUNT_ID}
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  logs:
