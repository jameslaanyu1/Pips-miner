name: pips_miner_app
description: Volatility + Momentum Trading Bot Mobile App
publish_to: 'none'

# The release workflow replaces this version with a monotonically increasing
# CI version before every production build.
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  
  # API & Networking
  http: ^1.1.0
  dio: ^5.3.0
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  
  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  fl_chart: ^0.65.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Auth & Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  
  # Utils
  intl: ^0.19.0
  get: ^4.6.5
  equatable: ^2.0.5
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  flutter_app_installer: ^2.0.0
  url_launcher: ^6.3.2
  
  # Notifications
  flutter_local_notifications: ^19.5.0

  # Background Tasks
  flutter_background_service: ^5.1.0
  
  # Background Tasks
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/pips_miner_pro_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/pips_miner_pro_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/pips_miner_pro_icon.png
