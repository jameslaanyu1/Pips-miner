name: Volatility Entry Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch volatility entry logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mobile_app')
          config=root/'lib/models/trading_config.dart'
          engine=root/'lib/services/velocity_reversal_engine.dart'
          strategy=root/'lib/strategy/volatility_expansion.dart'
          c=config.read_text()
          if 'final int volatilityBaselinePeriod;' not in c:
            c=c.replace('  final double volumeExpansionThreshold;\n','  final double volumeExpansionThreshold;\n\n  final int volatilityBaselinePeriod;\n  final double volatilityExpansionThreshold;\n',1)
          if 'this.volatilityBaselinePeriod = 2' not in c:
            c=c.replace('    this.volumeExpansionThreshold = 1.5,\n','    this.volumeExpansionThreshold = 1.5,\n\n    this.volatilityBaselinePeriod = 2,\n    this.volatilityExpansionThreshold = 1.0,\n',1)
          config.write_text(c)
          if not strategy.exists():
            strategy.write_text("""import '../models/candle.dart';

enum VolatilityDirection { bullish, bearish, neutral }

class VolatilityExpansionResult {
  final VolatilityDirection direction;
  final double currentRange;
  final double baselineRange;
  final double expansionRatio;
  final bool expanded;
  const VolatilityExpansionResult({required this.direction,required this.currentRange,required this.baselineRange,required this.expansionRatio,required this.expanded});
  static const empty=VolatilityExpansionResult(direction:VolatilityDirection.neutral,currentRange:0,baselineRange:0,expansionRatio:0,expanded:false);
}

class VolatilityExpansion {
  static VolatilityExpansionResult analyze(List<Candle> candles,{int baselinePeriod=2,double expansionThreshold=1.0}) {
    if(baselinePeriod<=0||candles.length<baselinePeriod+1)return VolatilityExpansionResult.empty;
    final current=candles[candles.length-1];
    final previous=candles[candles.length-2];
    final start=candles.length-baselinePeriod-1;
    final end=candles.length-2;
    var total=0.0;
    for(int i=start;i<=end;i++) total+=(candles[i].high-candles[i].low).abs();
    final baseline=total/baselinePeriod;
    final currentRange=(current.high-current.low).abs();
    if(baseline<=0)return VolatilityExpansionResult(direction:VolatilityDirection.neutral,currentRange:currentRange,baselineRange:baseline,expansionRatio:0,expanded:false);
    final ratio=currentRange/baseline;
    final expanded=ratio>expansionThreshold;
    var direction=VolatilityDirection.neutral;
    if(expanded){
      if(current.close>current.open)direction=VolatilityDirection.bullish;
      else if(current.close<current.open)direction=VolatilityDirection.bearish;
      else if(current.close>previous.close)direction=VolatilityDirection.bullish;
      else if(current.close<previous.close)direction=VolatilityDirection.bearish;
    }
    return VolatilityExpansionResult(direction:direction,currentRange:currentRange,baselineRange:baseline,expansionRatio:ratio,expanded:expanded);
  }
}
""")
          e=engine.read_text()
          if "../strategy/volatility_expansion.dart" not in e:
            e=e.replace("import '../strategy/velocity_expansion.dart';\n","import '../strategy/velocity_expansion.dart';\nimport '../strategy/volatility_expansion.dart';\n",1)
          if 'final livePrice = await _liveEntryPrice();' not in e:
            e=e.replace("    if (candles.length < config.velocityBaselinePeriod + 1) {\n      return;\n    }\n\n    final positions = await api.positions();\n", "    if (candles.length < config.velocityBaselinePeriod + 1) {\n      return;\n    }\n\n    final livePrice = await _liveEntryPrice();\n    if (livePrice != null && livePrice > 0) {\n      final last = candles.last;\n      candles[candles.length - 1] = Candle(time: last.time, open: last.open, high: last.high > livePrice ? last.high : livePrice, low: last.low < livePrice ? last.low : livePrice, close: livePrice, volume: last.volume);\n    }\n\n    final positions = await api.positions();\n",1)
          old="""    if (_activePositionId == null) {
      await _lookForInitialVelocityEntry(candles);
      return;
    }
"""
          new="""    if (_activePositionId == null) {
      await _lookForInitialVolatilityEntry(candles);
      return;
    }
"""
          if old in e:e=e.replace(old,new,1)
          if '_lookForInitialVolatilityEntry' not in e:
            marker='  Future<void> _lookForInitialVelocityEntry(List<Candle> candles) async {\n'
            method="""  Future<void> _lookForInitialVolatilityEntry(List<Candle> candles) async {
    final signal = VolatilityExpansion.analyze(candles, baselinePeriod: config.volatilityBaselinePeriod, expansionThreshold: config.volatilityExpansionThreshold);
    if (!signal.expanded || signal.direction == VolatilityDirection.neutral) return;
    final buy = signal.direction == VolatilityDirection.bullish;
    _activeVolume = await _calculatePositionVolume(buy: buy);
    await api.marketOrder(symbol: config.symbol, volume: _activeVolume, buy: buy, clientId: '${_clientPrefix}_${DateTime.now().millisecondsSinceEpoch}', magic: magic);
    for (int attempt = 0; attempt < 5; attempt++) {
      await Future<void>.delayed(const Duration(milliseconds: 300));
      final positions = await api.positions();
      final match = positions.whereType<Map>().map((p)=>Map<String,dynamic>.from(p)).where(_isStrategyPosition).where((p)=>p['symbol']==config.symbol).where((p)=>_positionDirection(p)==(buy?EnginePositionDirection.buy:EnginePositionDirection.sell)).firstOrNull;
      if(match!=null){
        _activePositionId=match['id']?.toString();
        _activeDirection=buy?EnginePositionDirection.buy:EnginePositionDirection.sell;
        await _createReversalStop(_opposite(_activeDirection!));
        return;
      }
    }
    throw Exception('MetaApi market order succeeded but the new position was not visible after several terminal-state checks.');
  }

"""
            if marker not in e: raise SystemExit('entry marker not found')
            e=e.replace(marker,method+marker,1)
          if 'Future<double?> _liveEntryPrice()' not in e:
            anchor='  Future<double> _calculatePositionVolume({required bool buy}) async {\n'
            helper="""  Future<double?> _liveEntryPrice() async {
    final quote = await api.symbolPrice(config.symbol);
    double? number(dynamic value) { if (value is num) return value.toDouble(); return double.tryParse(value?.toString() ?? ''); }
    final direct=number(quote['price'] ?? quote['currentPrice'] ?? quote['mid']);
    if(direct!=null&&direct>0)return direct;
    final bid=number(quote['bid'] ?? quote['Bid']);
    final ask=number(quote['ask'] ?? quote['Ask']);
    if(bid!=null&&ask!=null&&bid>0&&ask>0)return (bid+ask)/2.0;
    return bid ?? ask;
  }

"""
            if anchor not in e: raise SystemExit('volume anchor not found')
            e=e.replace(anchor,helper+anchor,1)
          engine.write_text(e)
          PY

      - name: Verify patch
        run: |
          grep -n "volatilityBaselinePeriod" mobile_app/lib/models/trading_config.dart
          grep -n "_lookForInitialVolatilityEntry" mobile_app/lib/services/velocity_reversal_engine.dart
          test -f mobile_app/lib/strategy/volatility_expansion.dart

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_app/lib/models/trading_config.dart mobile_app/lib/services/velocity_reversal_engine.dart mobile_app/lib/strategy/volatility_expansion.dart .github/workflows/volatility-entry-fix.yml
          git commit -m "Add intrabar volatility expansion entry with 2-candle baseline"
          git rm .github/workflows/volatility-entry-fix.yml
          git commit -m "Remove one-shot volatility entry patch workflow"
          git push origin main
