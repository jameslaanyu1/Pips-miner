name: Build Android APK

on:
  push:
    branches:
      - main
      - apk-build
      - agent/pips-miner-rebuild
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=pips_miner .

      - name: Enable core library desugaring
        run: |
          python - <<'PY2'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          p = next((x for x in candidates if x.exists()), None)

          if p is None:
              raise SystemExit("ERROR: Android app Gradle file not found")

          s = p.read_text()

          if p.name == "build.gradle.kts":
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  if "compileOptions {" not in s:
                      raise SystemExit("ERROR: compileOptions block not found")

                  s = s.replace(
                      "compileOptions {",
                      """compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17""",
                      1
                  )

              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'

              if dependency not in s:
                  if "dependencies {" in s:
                      s = s.replace(
                          "dependencies {",
                          "dependencies {\n    " + dependency,
                          1
                      )
                  else:
                      s += "\n\ndependencies {\n    " + dependency + "\n}\n"

          else:
              if "coreLibraryDesugaringEnabled true" not in s:
                  if "compileOptions {" not in s:
                      raise SystemExit("ERROR: compileOptions block not found")

                  s = s.replace(
                      "compileOptions {",
                      """compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17""",
                      1
                  )

              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"

              if dependency not in s:
                  if "dependencies {" in s:
                      s = s.replace(
                          "dependencies {",
                          "dependencies {\n    " + dependency,
                          1
                      )
                  else:
                      s += "\n\ndependencies {\n    " + dependency + "\n}\n"

          p.write_text(s)
          print(f"Configured core library desugaring in {p}")
          PY2

      - name: Verify desugaring configuration
        run: |
          echo "=== Generated Android Gradle files ==="
          ls -la android/app/

          if [ -f android/app/build.gradle.kts ]; then
            echo "=== build.gradle.kts ==="
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            echo "=== build.gradle ==="
            cat android/app/build.gradle
          else
            echo "ERROR: No Android app Gradle file found"
            exit 1
          fi

      - name: Set Android app name to Pips Miner
        run: |
          python - <<'PY2'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="pips_miner"', 'android:label="Pips Miner"')
          s = s.replace('android:label="pips_miner_app"', 'android:label="Pips Miner"')
          p.write_text(s)
          PY2

      - name: Enable Android Internet access
        run: |
          python - <<'PY2'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    ' + permission)
          p.write_text(s)
          PY2

      - name: Remove generated test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons
      - name: Analyze Flutter project
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pips-miner-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
