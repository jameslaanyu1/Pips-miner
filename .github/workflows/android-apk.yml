name: Build and Release Pips Miner APK

on:
  push:
    branches: [main, feature/iv-options-zone-parser, feature/persist-iv-options-file]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Stamp release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('pubspec.yaml')
          text = path.read_text()
          n = os.environ['GITHUB_RUN_NUMBER']
          text, count = re.subn(r'^version:\s*[^\n]+$', f'version: 1.0.{n}+{n}', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('ERROR: version field not found')
          path.write_text(text)
          PY

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=pips_miner .

      - name: Configure Android build and desugaring
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()

          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              match = re.search(r'(?m)^android\s*\{', text)
              if not match:
                  raise SystemExit('ERROR: android block not found in build.gradle.kts')
              block_start = match.end()
              compile_options = '''\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }\n'''
              text = text[:block_start] + compile_options + text[block_start:]

          # Ensure a dependencies block exists; newer Flutter templates may omit it.
          if not re.search(r'(?m)^dependencies\s*\{', text):
              text += '\n\ndependencies {\n}\n'

          # google_mlkit_text_recognition references all script option classes,
          # so include the matching ML Kit artifacts to satisfy R8 in release builds.
          mlkit_deps = [
              '    implementation("com.google.mlkit:text-recognition:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
          ]
          if 'com.google.mlkit:text-recognition-chinese:' not in text:
              text = re.sub(
                  r'(?m)^dependencies\s*\{',
                  'dependencies {\n' + '\n'.join(mlkit_deps),
                  text,
                  count=1,
              )

          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
              text = re.sub(
                  r'(?m)^dependencies\s*\{',
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                  text,
                  count=1,
              )

          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36', 1)
          text = re.sub(r'(?m)^(\s*)namespace\s*=\s*"[^"]+"', r'\1namespace = "com.example.pips_miner"', text, count=1)
          text = re.sub(r'(?m)^(\s*)applicationId\s*=\s*"[^"]+"', r'\1applicationId = "com.example.pips_miner"', text, count=1)
          if 'applicationId = "com.example.pips_miner"' not in text:
              marker = text.find('defaultConfig {')
              insert = text.find('\n', marker) + 1
              text = text[:insert] + '        applicationId = "com.example.pips_miner"\n' + text[insert:]
          path.write_text(text)
          PY

      - name: Remove generated Flutter test
        run: rm -f test/widget_test.dart

      - name: Configure Android foreground trading service
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in perms:
              name = permission.split('name="', 1)[1].split('"', 1)[0]
              if name not in text:
                  text = text.replace('<application', permission + '\n\n    <application', 1)

          # The flutter_background_service plugin declares this service as exported=true.
          # Explicitly replace that attribute in the app manifest so the merger has one value.
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)

          service_name = 'id.flutter.flutter_background_service.BackgroundService'
          if service_name in text:
              import re
              text = re.sub(
                  r'(<service\s+android:name="' + re.escape(service_name) + r'"[^>]*?)android:exported="[^"]+"([^>]*>)',
                  r'\1android:exported="true" tools:replace="android:exported"\2',
                  text,
                  count=1,
              )
          else:
              service = '''        <service
              android:name="id.flutter.flutter_background_service.BackgroundService"
              android:exported="true"
              android:foregroundServiceType="specialUse"
              tools:replace="android:exported">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="User-initiated foreground trading engine for monitoring and managing the connected MT5 trading account." />
          </service>'''
              text = text.replace('    </application>', service + '\n    </application>', 1)
          path.write_text(text)
          PY

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path path="." name="external_storage_root" />
          </paths>
          EOF

      - name: Configure package identity and release signing
        env:
          PIPS_MINER_KEYSTORE_BASE64: ${{ secrets.PIPS_MINER_KEYSTORE_BASE64 }}
          PIPS_MINER_KEY_ALIAS: ${{ secrets.PIPS_MINER_KEY_ALIAS }}
          PIPS_MINER_KEYSTORE_PASSWORD: ${{ secrets.PIPS_MINER_KEYSTORE_PASSWORD }}
          PIPS_MINER_KEY_PASSWORD: ${{ secrets.PIPS_MINER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in PIPS_MINER_KEYSTORE_BASE64 PIPS_MINER_KEY_ALIAS PIPS_MINER_KEYSTORE_PASSWORD PIPS_MINER_KEY_PASSWORD; do
            [ -n "${!value}" ] || { echo "ERROR: Missing signing secret: $value"; exit 1; }
          done
          printf '%s' "$PIPS_MINER_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/Pips-Miner-release.jks
          keytool -list -keystore android/app/Pips-Miner-release.jks -alias "$PIPS_MINER_KEY_ALIAS" -storepass "$PIPS_MINER_KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$PIPS_MINER_KEYSTORE_PASSWORD
          keyPassword=$PIPS_MINER_KEY_PASSWORD
          keyAlias=$PIPS_MINER_KEY_ALIAS
          storeFile=app/Pips-Miner-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          imports = '''import java.util.Properties
          import java.io.FileInputStream
          val signingProperties = Properties()
          val signingPropertiesFile = rootProject.file("key.properties")
          if (signingPropertiesFile.exists()) signingProperties.load(FileInputStream(signingPropertiesFile))
          '''
          if 'signingPropertiesFile' not in text:
              text = imports + text
          if 'create("pipsMinerRelease")' not in text:
              signing = '''
              signingConfigs {
                  create("pipsMinerRelease") {
                      keyAlias = signingProperties.getProperty("keyAlias")
                      keyPassword = signingProperties.getProperty("keyPassword")
                      storeFile = signingProperties.getProperty("storeFile")?.let { rootProject.file(it) }
                      storePassword = signingProperties.getProperty("storePassword")
                  }
              }
              '''
              text = text.replace('android {', 'android {' + signing, 1)
          text = re.sub(
              r'(?m)^\s*signingConfig\s*=.*$',
              '            signingConfig = signingConfigs.getByName("pipsMinerRelease")',
              text,
              count=1,
          )
          if 'signingConfig = signingConfigs.getByName("pipsMinerRelease")' not in text:
              text = text.replace('release {', 'release {\n            signingConfig = signingConfigs.getByName("pipsMinerRelease")', 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --build-name="1.0.${GITHUB_RUN_NUMBER}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify APK output
        working-directory: .
        run: |
          set -euo pipefail
          APK="mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Prepare release APK
        working-directory: .
        run: cp mobile_app/build/app/outputs/flutter-apk/app-release.apk Pips-Miner-release.apk

      - name: Verify release APK identity, version, signature, and checksum
        working-directory: .
        run: |
          set -euo pipefail
          APK="Pips-Miner-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$APKANALYZER"

          "$APKSIGNER" verify --verbose "$APK"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"

          echo "APK applicationId: $APP_ID"
          echo "APK versionName: $VERSION_NAME"
          echo "APK versionCode: $VERSION_CODE"
          "$APKSIGNER" verify --print-certs "$APK"

          test "$APP_ID" = "com.example.pips_miner" || {
            echo "ERROR: Unexpected application ID: $APP_ID"
            exit 1
          }
          test "$VERSION_CODE" = "$GITHUB_RUN_NUMBER" || {
            echo "ERROR: APK versionCode does not match this workflow run number"
            exit 1
          }
          test "$VERSION_NAME" = "1.0.$GITHUB_RUN_NUMBER" || {
            echo "ERROR: APK versionName does not match this workflow run number"
            exit 1
          }

          sha256sum "$APK" | tee Pips-Miner-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pips-Miner-v1.0.${{ github.run_number }}-${{ github.run_id }}
          path: |
            Pips-Miner-release.apk
            Pips-Miner-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pips Miner v1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: |
            Pips-Miner-release.apk
            Pips-Miner-release.apk.sha256
          token: ${{ github.token }}
