name: Build Android APK

on:
  push:
    branches:
      - main
      - apk-build
      - agent/pips-miner-rebuild
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=pips_miner_app .

      - name: Enable Android Internet access
        run: |
          python - <<'PY2'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    ' + permission)
          p.write_text(s)
          PY2

      - name: Remove generated test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons
      - name: Analyze Flutter project
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pips-miner-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
