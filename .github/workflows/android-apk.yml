name: Build and Release Pips Miner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Stamp release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('pubspec.yaml')
          text = path.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          text, count = re.subn(r'^version:\s*[^\n]+$', f'version: 1.0.{run_number}+{run_number}', text, count=1, flags=re.MULTILINE)
          if count != 1: raise SystemExit('ERROR: pubspec.yaml version field not found')
          path.write_text(text)
          PY

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=pips_miner .

      - name: Configure package identity and release signing
        env:
          PIPS_MINER_KEYSTORE_BASE64: ${{ secrets.PIPS_MINER_KEYSTORE_BASE64 }}
          PIPS_MINER_KEY_ALIAS: ${{ secrets.PIPS_MINER_KEY_ALIAS }}
          PIPS_MINER_KEYSTORE_PASSWORD: ${{ secrets.PIPS_MINER_KEYSTORE_PASSWORD }}
          PIPS_MINER_KEY_PASSWORD: ${{ secrets.PIPS_MINER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in PIPS_MINER_KEYSTORE_BASE64 PIPS_MINER_KEY_ALIAS PIPS_MINER_KEYSTORE_PASSWORD PIPS_MINER_KEY_PASSWORD; do
            [ -n "${!value}" ] || { echo "ERROR: Missing signing secret: $value"; exit 1; }
          done
          printf '%s' "$PIPS_MINER_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/Pips-Miner-release.jks
          keytool -list -keystore android/app/Pips-Miner-release.jks -alias "$PIPS_MINER_KEY_ALIAS" -storepass "$PIPS_MINER_KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$PIPS_MINER_KEYSTORE_PASSWORD
          keyPassword=$PIPS_MINER_KEY_PASSWORD
          keyAlias=$PIPS_MINER_KEY_ALIAS
          storeFile=app/Pips-Miner-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('android/app/build.gradle.kts'); text=path.read_text()
          text=text.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36',1)
          text=re.sub(r'(?m)^(\s*)namespace\s*=\s*"[^"]+"',r'\1namespace = "com.example.pips_miner"',text,count=1)
          if 'applicationId = "com.example.pips_miner"' not in text:
              marker=text.find('defaultConfig {')
              if marker<0: raise SystemExit('ERROR: defaultConfig block not found')
              insert=text.find('\n',marker)+1
              text=text[:insert]+'        applicationId = "com.example.pips_miner"\n'+text[insert:]
          else:
              text=re.sub(r'(?m)^(\s*)applicationId\s*=\s*"[^"]+"',r'\1applicationId = "com.example.pips_miner"',text,count=1)
          if 'isCoreLibraryDesugaringEnabled = true' not in text: text=text.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
          text=re.sub(r'(?m)^\s*coreLibraryDesugaring\(.*\)\s*$','',text)
          imports='''import java.util.Properties\nimport java.io.FileInputStream\nval signingProperties = Properties()\nval signingPropertiesFile = rootProject.file("key.properties")\nif (signingPropertiesFile.exists()) signingProperties.load(FileInputStream(signingPropertiesFile))\n'''
          if 'signingPropertiesFile' not in text: text=imports+text
          if 'create("pipsMinerRelease")' not in text:
              signing='''\n    signingConfigs {\n        create("pipsMinerRelease") {\n            keyAlias = signingProperties.getProperty("keyAlias")\n            keyPassword = signingProperties.getProperty("keyPassword")\n            storeFile = signingProperties.getProperty("storeFile")?.let { rootProject.file(it) }\n            storePassword = signingProperties.getProperty("storePassword")\n        }\n    }\n'''
              text=text.replace('android {','android {'+signing,1)
          if 'signingConfig = signingConfigs.getByName("pipsMinerRelease")' not in text:
              marker=text.find('buildTypes {'); release=text.find('release {',marker)
              if marker<0 or release<0: raise SystemExit('ERROR: release build type not found')
              insert=release+len('release {')
              text=text[:insert]+'\n            signingConfig = signingConfigs.getByName("pipsMinerRelease")'+text[insert:]
          if 'desugar_jdk_libs:2.1.5' not in text: text=text.rstrip()+'\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          path.write_text(text)
          PY

      - name: Verify package identity before build
        run: |
          set -euo pipefail
          expected='com.example.pips_miner'
          namespace=$(sed -n 's/^[[:space:]]*namespace[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          application_id=$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          echo "Expected package: $expected"; echo "Namespace: $namespace"; echo "ApplicationId: $application_id"
          test "$namespace" = "$expected"; test "$application_id" = "$expected"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Remove generated widget test
        run: rm -f test/widget_test.dart

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --build-name="1.0.${GITHUB_RUN_NUMBER}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify APK package and release certificate
        env:
          PIPS_MINER_KEY_ALIAS: ${{ secrets.PIPS_MINER_KEY_ALIAS }}
          PIPS_MINER_KEYSTORE_PASSWORD: ${{ secrets.PIPS_MINER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK='build/app/outputs/flutter-apk/app-release.apk'
          KEYSTORE='android/app/Pips-Miner-release.jks'
          expected_package='com.example.pips_miner'
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          test -f "$APK" || { echo "ERROR: APK not found: $APK"; exit 1; }
          actual_package=$("$build_tools/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "APK package: $actual_package"
          test "$actual_package" = "$expected_package"
          expected_cert=$(keytool -list -v -keystore "$KEYSTORE" -alias "$PIPS_MINER_KEY_ALIAS" -storepass "$PIPS_MINER_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$build_tools/apksigner" verify --print-certs "$APK" 2>/dev/null | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          echo "Release certificate: $expected_cert"; echo "APK certificate: $actual_cert"
          test -n "$expected_cert"; test -n "$actual_cert"; test "$expected_cert" = "$actual_cert"
          echo 'PASS: package identity and release certificate match.'

      - name: Prepare release APK
        working-directory: .
        run: cp mobile_app/build/app/outputs/flutter-apk/app-release.apk Pips-Miner-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pips-Miner-v1.0.${{ github.run_number }}
          path: Pips-Miner-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pips Miner v1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: Pips-Miner-release.apk
          token: ${{ github.token }}