name: Build and Release Pips Miner APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Every main-branch update must produce a fresh APK and latest GitHub release.
# This also provides a simple trigger point for the automatic in-app updater.

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Stamp release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("pubspec.yaml")
          text = path.read_text()
          run_id = os.environ["GITHUB_RUN_ID"]
          # Keep Flutter's version/build metadata strictly numeric for Android.
          # The Android Gradle script is also patched below to use run_id directly.
          version = f"1.0.{os.environ['GITHUB_RUN_NUMBER']}+{run_id}"
          text, count = re.subn(
              r"^version:\s*[^\n]+$",
              f"version: {version}",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("ERROR: pubspec.yaml version field not found")
          path.write_text(text)
          print(f"Pips Miner release version: {version}")
          PY

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=pips_miner .

      - name: Configure Android build and update installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("ERROR: Android app Gradle file not found")

          text = gradle.read_text()

          # Flutter 3.35's generated Kotlin Gradle file can expose the pubspec
          # build number as a String. Android's versionCode must be an Int.
          # Use the numeric GitHub run ID explicitly so this can never fail the
          # release build because of Flutter/Gradle type conversion.
          text = re.sub(
              r"(?m)^\s*val flutterVersionCode\s*=\s*flutter\.versionCode\s*$",
              'val flutterVersionCode: Int = System.getenv("GITHUB_RUN_ID")?.toIntOrNull() ?: 1',
              text,
          )
          text = re.sub(
              r"(?m)^\s*val flutterVersionName\s*=\s*flutter\.versionName\s*$",
              'val flutterVersionName: String = "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "1"}"',
              text,
          )

          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36", 1)

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              if "compileOptions {" not in text:
                  raise SystemExit("ERROR: compileOptions block not found in Android Gradle file")
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          text = re.sub(r"^\s*coreLibraryDesugaring\(.*\)\s*$", "", text, flags=re.MULTILINE)
          text = text.rstrip() + "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n}\n"
          gradle.write_text(text)
          PY

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external-path" path="." />
              <external-cache-path name="external-cache-path" path="." />
              <external-files-path name="external-files-path" path="." />
              <files-path name="files-path" path="." />
              <cache-path name="cache-path" path="." />
              <root-path name="root" path="." />
          </paths>
          XML

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if 'xmlns:tools="http://schemas.android.com/tools"' not in text:
              text = text.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"',
                  1,
              )

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)

          provider = '''    <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="${applicationId}.fileProvider"
              android:exported="false"
              android:grantUriPermissions="true"
              tools:replace="android:authorities">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths"
                  tools:replace="android:resource" />
          </provider>
          '''

          if "${applicationId}.fileProvider" not in text:
              text = text.replace("</application>", provider + "</application>", 1)

          text = text.replace('android:label="pips_miner"', 'android:label="Pips Miner"')
          text = text.replace('android:label="pips_miner_app"', 'android:label="Pips Miner"')
          manifest.write_text(text)
          PY

      - name: Remove generated widget test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release APK
        working-directory: .
        run: cp mobile_app/build/app/outputs/flutter-apk/app-release.apk Pips-Miner-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pips-Miner-release
          path: Pips-Miner-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.${GITHUB_RUN_ID}"
          RELEASE_TITLE="Pips Miner v1.0.${GITHUB_RUN_ID}"

          gh release create "${RELEASE_TAG}" \
            Pips-Miner-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            --latest
