name: Build Pips Miner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - "mobile_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=pips_miner \
            --org=com.pipsminer \
            .

      - name: Set Android compile SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Configure Android foreground trading service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<application',
                      permission + '\\n    <application',
                      1,
                  )

          service = '''    <service
              android:name="id.flutter.flutter_background_service.BackgroundService"
              android:exported="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="continuous user-initiated MT5 trading engine execution" />
          </service>
          '''

          if 'id.flutter.flutter_background_service.BackgroundService' not in text:
              text = text.replace(
                  '</application>',
                  service + '</application>',
                  1,
              )

          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        working-directory: .
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk \
             Pips-Miner-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pips-Miner-release
          path: Pips-Miner-release.apk
          if-no-files-found: error
