name: Build Pips Miner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - "mobile_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --android-language kotlin \
            --project-name=pips_miner \
            --org=com.pipsminer \
            .

      - name: Set Android compile SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Configure Android build and core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts was not generated"
              )

          text = gradle.read_text()

          # Force compile SDK 36.
          text = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              text,
              count=1,
          )

          # Remove a previous block created by this workflow.
          text = re.sub(
              r"\n// PIPS_MINER_DESUGARING_BEGIN.*?"
              r"// PIPS_MINER_DESUGARING_END\n?",
              "\n",
              text,
              flags=re.DOTALL,
          )

          # IMPORTANT:
          # Use a separate Android configuration block so this cannot be
          # lost or incorrectly replaced when Flutter regenerates the project.
          forced = """
// PIPS_MINER_DESUGARING_BEGIN
android {
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        isCoreLibraryDesugaringEnabled = true
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
// PIPS_MINER_DESUGARING_END
"""

          text = text.rstrip() + "\n" + forced
          gradle.write_text(text)

          verify = gradle.read_text()

          required = [
              "compileSdk = 36",
              "sourceCompatibility = JavaVersion.VERSION_17",
              "targetCompatibility = JavaVersion.VERSION_17",
              "isCoreLibraryDesugaringEnabled = true",
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
          ]

          missing = [x for x in required if x not in verify]

          if missing:
              raise SystemExit(
                  "VERIFY FAILED: " + ", ".join(missing)
              )

          if verify.count(
              "isCoreLibraryDesugaringEnabled = true"
          ) != 1:
              raise SystemExit(
                  "VERIFY FAILED: desugaring flag is not exactly once"
              )

          if verify.count(
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          ) != 1:
              raise SystemExit(
                  "VERIFY FAILED: desugaring dependency is not exactly once"
              )

          print("============================================")
          print("PIPS MINER ANDROID CONFIG VERIFIED")
          print("compileSdk: 36")
          print("Java: 17")
          print("core library desugaring: ENABLED")
          print("desugar_jdk_libs: 2.1.4")
          print("============================================")
          PY

          echo "===== FINAL GENERATED APP GRADLE ====="
          cat android/app/build.gradle.kts
          echo "======================================"
      - name: Configure Android foreground trading service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<application',
                      permission + '\\n    <application',
                      1,
                  )

          service = '''    <service
              android:name="id.flutter.flutter_background_service.BackgroundService"
              android:exported="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="continuous user-initiated MT5 trading engine execution" />
          </service>
          '''

          if 'id.flutter.flutter_background_service.BackgroundService' not in text:
              text = text.replace(
                  '</application>',
                  service + '</application>',
                  1,
              )

          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        working-directory: .
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk \
             Pips-Miner-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pips-Miner-release
          path: Pips-Miner-release.apk
          if-no-files-found: error
