name: Build Pips Miner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout Pips-miner
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=pips_miner_app .

      - name: Allow local backend HTTP
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "mobile_app/android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          p.write_text(s)
          print("Enabled local HTTP for Termux backend")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pips-miner-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
