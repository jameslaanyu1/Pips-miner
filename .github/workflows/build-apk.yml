name: Build Pips Miner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - "mobile_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=pips_miner \
            --org=com.pipsminer \
            .

      - name: Set Android compile SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Configure Android build and core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()

          # Flutter generates ONE compileOptions block.
          # Modify that existing block; never create a second one.
          match = re.search(
              r"compileOptions\s*\{[^{}]*\}",
              text,
              re.DOTALL,
          )

          if not match:
              raise SystemExit(
                  "ERROR: generated compileOptions block not found"
              )

          compile_options = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
              isCoreLibraryDesugaringEnabled = true
          }"""

          text = (
              text[:match.start()]
              + compile_options
              + text[match.end():]
          )

          # Remove every previous desugaring dependency.
          text = re.sub(
              r"\n\s*coreLibraryDesugaring\s*\(\s*['\"][^'\"]+['\"]\s*\)",
              "",
              text,
          )

          # Find the REAL dependencies block and add exactly one dependency.
          dependency_marker = re.search(
              r"dependencies\s*\{",
              text,
          )

          if not dependency_marker:
              raise SystemExit(
                  "ERROR: generated dependencies block not found"
              )

          dependency = (
              '\n    coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          text = (
              text[:dependency_marker.end()]
              + dependency
              + text[dependency_marker.end():]
          )

          # flutter_local_notifications requires compileSdk 35+.
          text = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              text,
              count=1,
          )

          gradle.write_text(text)

          # HARD verification before Gradle is allowed to run.
          verify = gradle.read_text()

          if verify.count(
              "isCoreLibraryDesugaringEnabled = true"
          ) != 1:
              raise SystemExit(
                  "VERIFY FAILED: desugaring flag is not exactly once"
              )

          if verify.count(
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          ) != 1:
              raise SystemExit(
                  "VERIFY FAILED: desugaring dependency is not exactly once"
              )

          if "sourceCompatibility = JavaVersion.VERSION_17" not in verify:
              raise SystemExit(
                  "VERIFY FAILED: Java 17 sourceCompatibility missing"
              )

          if "targetCompatibility = JavaVersion.VERSION_17" not in verify:
              raise SystemExit(
                  "VERIFY FAILED: Java 17 targetCompatibility missing"
              )

          if "compileSdk = 36" not in verify:
              raise SystemExit(
                  "VERIFY FAILED: compileSdk 36 missing"
              )

          print("============================================")
          print("ANDROID BUILD CONFIG VERIFIED")
          print("compileSdk: 36")
          print("Java: 17")
          print("core library desugaring: ENABLED")
          print("desugar_jdk_libs: 2.1.4")
          print("============================================")
          PY

      - name: Configure Android foreground trading service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<application',
                      permission + '\\n    <application',
                      1,
                  )

          service = '''    <service
              android:name="id.flutter.flutter_background_service.BackgroundService"
              android:exported="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="continuous user-initiated MT5 trading engine execution" />
          </service>
          '''

          if 'id.flutter.flutter_background_service.BackgroundService' not in text:
              text = text.replace(
                  '</application>',
                  service + '</application>',
                  1,
              )

          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        working-directory: .
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk \
             Pips-Miner-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pips-Miner-release
          path: Pips-Miner-release.apk
          if-no-files-found: error
